# Disable confirmation window when closing Kitty
confirm_os_window_close 0

# Font
font_family Iosevka NFM
font_size 11.0

# Cursor
cursor_shape beam
cursor_shape_unfocused unchanged
cursor_blink_interval -1
cursor_trail 1
cursor_trail_decay 0.1 0.3

# Scrolling
scrollbar never
scrollback_lines 700

# Tab bar
tab_bar_edge top
